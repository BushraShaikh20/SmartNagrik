name: smart_nagrik
description: "Smart Nagrik - Report, Track, Resolve Civic Issues and Emergency Assistance App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/illustrations/
    - assets/images/placeholders/
    - assets/icons/

